<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulp Fiction: Von Casus Belli</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/album.css">
    <link rel="stylesheet" href="css/player.css">
</head>
<body>

<header class="album-header">

    <img class="cover" src="assets/covers/final.png" alt="Pulp Fiction: Von Casus Belli">

    <div class="album-info">

        <span class="album-type">Альбом</span>

        <h1>Pulp Fiction: Von Casus Belli</h1>

        <p>Shawn Wayne • 17 июля 2026 • 13 треков • 33 мин. 25 сек.</p>

        <button class="play-btn" id="albumPlay">▶</button>

    </div>

</header>

<main class="track-list">

    <div class="tracks-header">

        <span>#</span>
        <span>Название</span>
        <span>Стримы</span>
        <span>Аннотация</span>
        <span>Длительность</span>

    </div>

    <div id="tracks"></div>

</main>

<div id="player" class="player">

    <div class="player-left">

        <img id="playerCover"
             src="assets/covers/final.png"
             alt="">

        <div>

            <div id="playerTitle">—</div>

            <div class="playerArtist">Shawn Wayne</div>

        </div>

    </div>

    <div class="player-center">

        <button id="prevBtn">⏮</button>

        <button id="playPauseBtn">⏸</button>

        <button id="nextBtn">⏭</button>

        <div class="progress">

            <span id="currentTime">0:00</span>

            <input
                type="range"
                id="progressBar"
                value="0"
                min="0"
                max="100">

            <span id="durationTime">0:00</span>

        </div>

    </div>

</div>
    
<div id="lyricsModal" class="lyrics-modal">


<div class="lyrics-window">


<button id="closeLyrics">
✕
</button>


<h2 id="lyricsTitle">
</h2>


<div id="lyricsText">

</div>


</div>


</div>
    
<audio id="audio"></audio>

<script src="js/tracks.js"></script>
<script src="js/player.js"></script>
<script src="js/album.js"></script>

</body>
</html>
