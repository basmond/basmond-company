<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fall-Off</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/album.css">
    <link rel="stylesheet" href="css/player.css">
</head>
<body>

<header class="album-header">

    <img class="cover" src="assets/covers/falloff.jpg" alt="The Fall-Off">

    <div class="album-info">

        <span class="album-type">Альбом</span>

        <h1>The Fall-Off</h1>

        <p>J.Cole • 2026 • 24 трека • 1 ч. 41 мин.</p>

        <button class="play-btn" id="albumPlay">▶</button>

    </div>

</header>

<main class="track-list">

    <div class="tracks-header">

        <span>#</span>
        <span>Название</span>
        <span>Прослушиванияㅤ</span>
        <span>Аннотация</span>
        <span>Длительность</span>

    </div>

    <div id="tracks"></div>

</main>

<div id="player" class="player">

    <div class="player-left">

        <img id="playerCover"
             src="assets/covers/falloff.jpg"
             alt="">

        <div>

            <div id="playerTitle">—</div>

            <div class="playerArtist">J.Cole</div>

        </div>

    </div>

    <div class="player-center">

        <button id="prevBtn">⏮</button>

        <button id="playPauseBtn">⏸</button>

        <button id="nextBtn">⏭</button>

        <div class="progress">

            <span id="currentTime">0:00</span>

            <input
                type="range"
                id="progressBar"
                value="0"
                min="0"
                max="100">

            <span id="durationTime">0:00</span>

        </div>

    </div>

</div>
    
<div id="lyricsModal" class="lyrics-modal">


<div class="lyrics-window">


<button id="closeLyrics">
✕
</button>


<h2 id="lyricsTitle">
</h2>


<div id="lyricsText">

</div>


</div>


</div>
    
<audio id="audio"></audio>

<script src="js/tracks.js"></script>
<script src="js/player.js"></script>
<script src="js/album.js"></script>

</body>
</html>
